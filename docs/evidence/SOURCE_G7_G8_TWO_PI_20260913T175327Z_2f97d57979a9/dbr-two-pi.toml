[identity]
name = "workerpi1-diy-router"
location = "isolated two-Pi source test"

[management]
bind = "127.0.0.1:8080"
web_root = "frontend/web/dist"
metrics_interval_ms = 1000
max_ws_connections = 8

[router]
enabled = false

[bacnet_ip]
interface = "eth0"
bind_address = "192.168.204.59"
broadcast_address = "192.168.204.255"
udp_port = 47808
network = 1
bbmd_enabled = false
foreign_device_enabled = false

[mstp]
serial = "/dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BH002I9S-if00-port0"
adapter_profile = "waveshare-usb-to-rs485-c"
termination = "onboard-present"
baud = 38400
mac = 1
network = 2001
max_master = 2
max_info_frames = 1
