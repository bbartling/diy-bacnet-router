[package]
name = "diy-bacnet-server"
version = "1.2.0"
edition = "2021"
rust-version = "1.93"
description = "Open-FDD field-bus sidecar — pure Rust axum API (no FastAPI/Python)"
license = "MIT"

[[bin]]
name = "diy-bacnet-server"
path = "src/main.rs"

[dependencies]
# Web stack (FastAPI → axum)
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Models (Pydantic → serde + validator + utoipa)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
validator = { version = "0.20", features = ["derive"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
thiserror = "2"
subtle = "2"

# Config / HTTP client
dotenvy = "0.15"
toml = "0.8"
csv = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

# BACnet (native rusty-bacnet — no PyO3)
bacnet-types = { path = "../../rusty-bacnet/crates/bacnet-types" }
bacnet-encoding = { path = "../../rusty-bacnet/crates/bacnet-encoding" }
bacnet-services = { path = "../../rusty-bacnet/crates/bacnet-services" }
bacnet-transport = { path = "../../rusty-bacnet/crates/bacnet-transport" }
bacnet-client = { path = "../../rusty-bacnet/crates/bacnet-client" }
bacnet-objects = { path = "../../rusty-bacnet/crates/bacnet-objects" }
bacnet-server = { path = "../../rusty-bacnet/crates/bacnet-server" }
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }

# Haystack (native client)
haystack_client = { package = "rusty-haystack-client", path = "../../rusty-haystack/haystack-client" }
haystack_core = { package = "rusty-haystack-core", path = "../../rusty-haystack/haystack-core" }

# Modbus (native client)
rusty-modbus-client = { git = "https://github.com/jscott3201/rusty-modbus.git", branch = "dev" }
rusty-modbus-types = { git = "https://github.com/jscott3201/rusty-modbus.git", branch = "dev", package = "rusty-modbus-types" }

[dev-dependencies]
tokio-test = "0.4"
http-body-util = "0.1"
axum-test = "18"
