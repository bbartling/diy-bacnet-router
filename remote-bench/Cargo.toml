[package]
name = "fieldbus-remote-bench"
version = "0.1.0"
edition = "2021"
description = "Remote HTTP client for diy-bacnet-server — prints BACnet/Modbus/Haystack values"
license = "MIT"

[[bin]]
name = "fieldbus-remote-bench"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
