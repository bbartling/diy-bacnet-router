# Open-FDD field-bus sidecar — long-running local deployment.
#
# Python (default):
#   docker compose up -d --build
#
# Pure Rust axum binary (requires rusty-bacnet + rusty-haystack sibling repos):
#   docker compose --profile rust up -d --build gateway-rust
#
# `restart: unless-stopped` keeps it running across crashes and host reboots.

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: diy-bacnet-server:local
    container_name: diy-bacnet-server
    network_mode: host
    restart: unless-stopped
    env_file:
      - path: .env.example
        required: false
      - path: .env
        required: false
    environment:
      OPENFDD_FIELDBUS_BIND: "${OPENFDD_FIELDBUS_BIND:-${RUSTY_GATEWAY_BIND:-192.168.204.55}}"
      OPENFDD_FIELDBUS_HTTP_PORT: "${OPENFDD_FIELDBUS_HTTP_PORT:-${RUSTY_GATEWAY_HTTP_PORT:-8080}}"
      OPENFDD_FIELDBUS_BACNET_PORT: "${OPENFDD_FIELDBUS_BACNET_PORT:-47808}"
      HAYSTACK_BASE_URL: "${HAYSTACK_BASE_URL:-http://127.0.0.1:8081}"
      MODBUS_DEFAULT_HOST: "${MODBUS_DEFAULT_HOST:-127.0.0.1}"
    volumes:
      - ./config:/app/config:ro

  gateway-rust:
    profiles: ["rust"]
    build:
      context: ..
      dockerfile: diy-bacnet-server/rust-api/Dockerfile
    image: diy-bacnet-server:rust
    container_name: diy-bacnet-server-rust
    network_mode: host
    restart: unless-stopped
    env_file:
      - path: .env.example
        required: false
      - path: .env
        required: false
    environment:
      OPENFDD_FIELDBUS_BIND: "${OPENFDD_FIELDBUS_BIND:-${RUSTY_GATEWAY_BIND:-192.168.204.55}}"
      OPENFDD_FIELDBUS_HTTP_PORT: "${OPENFDD_FIELDBUS_HTTP_PORT:-${RUSTY_GATEWAY_HTTP_PORT:-8080}}"
      OPENFDD_FIELDBUS_BACNET_PORT: "${OPENFDD_FIELDBUS_BACNET_PORT:-47808}"
      HAYSTACK_BASE_URL: "${HAYSTACK_BASE_URL:-http://127.0.0.1:8081}"
      MODBUS_DEFAULT_HOST: "${MODBUS_DEFAULT_HOST:-127.0.0.1}"
      OPENFDD_FIELDBUS_CONFIG_DIR: /app/config
    volumes:
      - ./config:/app/config:ro
