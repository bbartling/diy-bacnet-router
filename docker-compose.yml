# Open-FDD field-bus sidecar — pure Rust axum gateway.
#
#   docker compose up -d --build
#
# Build context must include sibling repos:
#   ../rusty-bacnet  ../rusty-haystack  diy-bacnet-server/
#
# `restart: unless-stopped` keeps it running across crashes and host reboots.

services:
  gateway:
    build:
      context: ..
      dockerfile: diy-bacnet-server/rust-api/Dockerfile
    image: diy-bacnet-server:rust
    container_name: diy-bacnet-server
    network_mode: host
    restart: unless-stopped
    env_file:
      - path: .env.example
        required: false
      - path: .env
        required: false
    environment:
      OPENFDD_FIELDBUS_BIND: "${OPENFDD_FIELDBUS_BIND:-${RUSTY_GATEWAY_BIND:-192.168.204.55}}"
      OPENFDD_FIELDBUS_HTTP_HOST: "${OPENFDD_FIELDBUS_HTTP_HOST:-0.0.0.0}"
      OPENFDD_FIELDBUS_HTTP_PORT: "${OPENFDD_FIELDBUS_HTTP_PORT:-${RUSTY_GATEWAY_HTTP_PORT:-8080}}"
      OPENFDD_FIELDBUS_BACNET_PORT: "${OPENFDD_FIELDBUS_BACNET_PORT:-47808}"
      OPENFDD_FIELDBUS_OPENAPI: "${OPENFDD_FIELDBUS_OPENAPI:-1}"
      OPENFDD_FIELDBUS_SWAGGER_SERVERS_URL: "${OPENFDD_FIELDBUS_SWAGGER_SERVERS_URL:-http://192.168.204.55:8080}"
      HAYSTACK_BASE_URL: "${HAYSTACK_BASE_URL:-https://192.168.204.11/haystack}"
      HAYSTACK_AUTH_MODE: "${HAYSTACK_AUTH_MODE:-basic}"
      OPENFDD_FIELDBUS_CONFIG_DIR: /app/config
    volumes:
      - ./config:/app/config:ro
