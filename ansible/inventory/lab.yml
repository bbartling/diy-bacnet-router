---
# Dual-mini MS/TP lab: bensbench is the BIP↔MS/TP router; both Pis are fixtures.
# Baud shared via dbr_baud. Max_Master 7 for FEC MAC7 at 38400.
all:
  children:
    mstp_fixture:
      hosts:
        workerpi2:
          ansible_host: 192.168.204.60
          ansible_user: ben
          mstp_serial: /dev/serial/by-id/usb-1a86_USB_Single_Serial_5A98075745-if00
          mstp_mac: 2
          mstp_device_instance: 123102
          mstp_device_name: Rust MS/TP Mini Device
          mstp_bin: /home/ben/src/py-bacnet-stacks-playground/vibe_code_apps_13/target/release/mstp-mini-device
          mstp_workdir: /home/ben/src/py-bacnet-stacks-playground/vibe_code_apps_13
          vibe_src_dir: /home/ben/src/py-bacnet-stacks-playground
          vibe_sha: 12e7d232b23023e1bb06da7b75972d79ca584cf9
        workerpi1:
          ansible_host: 192.168.204.59
          ansible_user: ben
          mstp_serial: /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BH002I9S-if00-port0
          mstp_mac: 3
          mstp_device_instance: 123103
          mstp_device_name: Rust MS/TP Mini Pi1
          mstp_bin: /home/ben/vibe13-build/target/release/mstp-mini-device
          mstp_workdir: /home/ben/vibe13-build
          vibe_src_dir: /home/ben/vibe13-build
          vibe_sha: af4e88680c51eb4da64dac47f0540a35bf184732
  vars:
    ansible_python_interpreter: /usr/bin/python3
    dbr_baud: 38400
    mstp_max_master: 7
    mstp_max_info_frames: 1
    fec_present: true
