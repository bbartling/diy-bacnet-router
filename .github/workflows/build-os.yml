name: build-os

on:
  pull_request:
    paths:
      - "buildroot-external/**"
      - "crates/**"
      - "frontend/**"
      - "scripts/build-image.sh"
      - "scripts/qemu-smoke.sh"
      - "config/buildroot-lock.toml"
      - "Cargo.*"
      - ".github/workflows/build-os.yml"
  workflow_dispatch:
    inputs:
      targets:
        description: "Build one target or the complete image matrix"
        required: true
        type: choice
        options: [x86_64, rpi3_64, rpi4_64, rpi5_64, all]
        default: "x86_64"
  push:
    branches: [master]
    paths:
      - "buildroot-external/**"
      - "crates/**"
      - "frontend/**"
      - "scripts/build-image.sh"
      - "scripts/qemu-smoke.sh"
      - "config/buildroot-lock.toml"
      - "Cargo.*"
      - ".github/workflows/build-os.yml"
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: build-os-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-targets:
    name: Select image targets
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Resolve requested target set
        id: targets
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TARGETS: ${{ inputs.targets || 'all' }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == pull_request ]]; then
            targets='["x86_64"]'
          else
            case "$REQUESTED_TARGETS" in
              x86_64|rpi3_64|rpi4_64|rpi5_64)
                targets="[\"$REQUESTED_TARGETS\"]"
                ;;
              all)
                targets='["x86_64","rpi3_64","rpi4_64","rpi5_64"]'
                ;;
              *)
                echo "Unsupported target selection: $REQUESTED_TARGETS" >&2
                exit 2
                ;;
            esac
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "Selected targets: $targets"

  image:
    name: ${{ matrix.target }} image
    needs: select-targets
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.select-targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Build management frontend
        run: npm --prefix frontend/web ci && npm --prefix frontend/web run build
      - name: Install Buildroot host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bc build-essential cpio file git libncurses-dev python3 rsync unzip wget xz-utils
      - name: Restore Buildroot download cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ runner.temp }}/dbr-buildroot/buildroot-2026.05.2/dl
          key: buildroot-dl-2026.05.2-${{ matrix.target }}-${{ hashFiles('Cargo.lock', 'frontend/web/package-lock.json', 'config/buildroot-lock.toml') }}
          restore-keys: |
            buildroot-dl-2026.05.2-${{ matrix.target }}-
            buildroot-dl-2026.05.2-
      - name: Build image
        env:
          JOBS: "3"
          BUILD_LOG: ${{ runner.temp }}/dbr-buildroot-${{ matrix.target }}.log
        run: |
          set -o pipefail
          bash scripts/build-image.sh "${{ matrix.target }}" 2>&1 | tee "$BUILD_LOG"
      - name: QEMU boot smoke
        if: matrix.target == 'x86_64'
        run: |
          sudo apt-get install --yes --no-install-recommends e2fsprogs qemu-system-x86 curl
          root="${RUNNER_TEMP}/dbr-buildroot/output/x86_64"
          for path in \
            "$root/images/bzImage" \
            "$root/images/rootfs.ext2"; do
            test -s "$path"
          done
          for guest_path in \
            /usr/bin/diy-bacnet-router \
            /etc/diy-bacnet-router/router.toml \
            /etc/init.d/S80diy-bacnet-router \
            /usr/share/diy-bacnet-router/web/index.html; do
            debugfs -R "stat $guest_path" "$root/images/rootfs.ext2" 2>/dev/null | grep -q 'Inode:'
          done
          QEMU_LOG="${RUNNER_TEMP}/dbr-qemu-x86_64.log" \
            bash scripts/qemu-smoke.sh "${RUNNER_TEMP}/dbr-buildroot/output/x86_64/images"
      - name: Verify image evidence
        run: |
          root="${RUNNER_TEMP}/dbr-buildroot/output/${{ matrix.target }}"
          test -d "$root/legal-info"
          test -s "$root/images/legal-info.tar.xz"
          test -s "$root/images/build-manifest.json"
          test -s "$root/images/buildroot-host-rustc-version.txt"
          test -s "$root/images/buildroot-host-cargo-version.txt"
          test -s "$root/images/SHA256SUMS"
          python3 - "$root/images/build-manifest.json" "${{ matrix.target }}" <<'PY'
          import json
          import sys
          with open(sys.argv[1], encoding="utf-8") as handle:
              manifest = json.load(handle)
          assert manifest["target"] == sys.argv[2]
          assert manifest["project_rust_toolchain"] == "1.93.0"
          assert manifest["rusty_bacnet"] == "not-integrated"
          assert manifest["buildroot_host_rustc_version"]
          assert manifest["buildroot_host_cargo_version"]
          PY
          mapfile -t image_files < <(
            find "$root/images" -maxdepth 1 -type f \
              ! -name SHA256SUMS \
              ! -name build-manifest.json \
              ! -name buildroot-host-rustc-version.txt \
              ! -name buildroot-host-cargo-version.txt \
              ! -name legal-info.tar.xz -print
          )
          test "${#image_files[@]}" -gt 0
          for image in "${image_files[@]}"; do test -s "$image"; done
          (cd "$root/images" && sha256sum --check --strict SHA256SUMS)
      - name: Collect failure diagnostics
        if: always()
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/dbr-buildroot/output/${{ matrix.target }}"
          diagnostics="${RUNNER_TEMP}/dbr-diagnostics-${{ matrix.target }}"
          mkdir -p "$diagnostics"
          for log in \
            "${RUNNER_TEMP}/dbr-buildroot-${{ matrix.target }}.log" \
            "${RUNNER_TEMP}/dbr-qemu-${{ matrix.target }}.log" \
            /tmp/diy-bacnet-router-qemu.log; do
            if [[ -s "$log" ]]; then
              cp "$log" "$diagnostics/"
            fi
          done
          if [[ -d "$root" ]]; then
            find "$root" -maxdepth 4 -type f \( -name '*.log' -o -name '*.err' \) \
              -exec cp --parents '{}' "$diagnostics" \; 2>/dev/null || true
          fi
          {
            echo "target=${{ matrix.target }}"
            echo "project_sha=${{ github.sha }}"
            echo "runner_os=${{ runner.os }}"
            date --iso-8601=seconds
            if [[ -f "$root/.config" ]]; then
              echo '--- Buildroot resolved configuration ---'
              grep -E '^(BR2_ARCH|BR2_PACKAGE_DIY_BACNET_ROUTER|BR2_PACKAGE_HOST_RUSTC|BR2_TARGET_ROOTFS|BR2_LINUX_KERNEL|BR2_TARGET_GENERIC_HOSTNAME)' "$root/.config" || true
            fi
          } > "$diagnostics/build-context.txt"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: always()
        with:
          name: diy-bacnet-router-${{ matrix.target }}-diagnostics-${{ github.run_id }}
          path: ${{ runner.temp }}/dbr-diagnostics-${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: diy-bacnet-router-${{ matrix.target }}-${{ github.sha }}
          path: ${{ runner.temp }}/dbr-buildroot/output/${{ matrix.target }}/images/
          if-no-files-found: error
          retention-days: 14
