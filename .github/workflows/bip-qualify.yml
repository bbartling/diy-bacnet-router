name: bip-qualify

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: bip-qualify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  netns:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Offline oracle and false-PASS regressions
        run: |
          bash scripts/test-bip-bvll-oracle.sh
          bash scripts/test-bip-g6-false-pass.sh
      - name: Build routerd
        run: cargo build -p routerd --locked
      - name: Run G6 B/IP netns qualification
        run: |
          EVIDENCE_ROOT="$RUNNER_TEMP/dbr-bip-g6"
          mkdir -p "$EVIDENCE_ROOT"
          sudo -E env "PATH=$PATH" \
            "DBR_BIN=$PWD/target/debug/diy-bacnet-router" \
            "DBR_BIP_EVIDENCE_DIR=$EVIDENCE_ROOT/run" \
            bash scripts/bip-qualify-netns.sh
          test -f "$EVIDENCE_ROOT/run/result.json"
          test -f "$EVIDENCE_ROOT/run/SHA256SUMS"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["status"]=="PASS"' \
            "$EVIDENCE_ROOT/run/result.json"
      - name: Run dual-B/IP netns route harness
        run: |
          EVIDENCE_ROOT="$RUNNER_TEMP/dbr-bip-bip"
          mkdir -p "$EVIDENCE_ROOT"
          sudo -E env "PATH=$PATH" \
            "DBR_BIN=$PWD/target/debug/diy-bacnet-router" \
            "DBR_ROUTE_EVIDENCE_DIR=$EVIDENCE_ROOT/run" \
            bash scripts/route-bip-bip-netns.sh
          test -f "$EVIDENCE_ROOT/run/result.json"
          test -f "$EVIDENCE_ROOT/run/SHA256SUMS"
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["status"]=="PASS"; assert r["product_g7_g8_bip_mstp"]=="OPEN"' \
            "$EVIDENCE_ROOT/run/result.json"
      - name: Upload G6 evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bip-g6-evidence
          path: ${{ runner.temp }}/dbr-bip-g6/
          if-no-files-found: warn
      - name: Upload dual-B/IP evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bip-bip-route-evidence
          path: ${{ runner.temp }}/dbr-bip-bip/
          if-no-files-found: warn
