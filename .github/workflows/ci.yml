# CI — pure Rust axum field-bus sidecar.

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Checkout path deps (sibling layout for ../../rusty-* paths)
        env:
          MONOREPO_ROOT: ${{ github.workspace }}/..
        run: |
          git clone --depth 1 https://github.com/bbartling/rusty-bacnet.git "$MONOREPO_ROOT/rusty-bacnet"
          git clone --depth 1 https://github.com/bbartling/rusty-haystack.git "$MONOREPO_ROOT/rusty-haystack"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96"
          components: rustfmt, clippy

      - name: Rust fmt
        working-directory: rust-api
        run: cargo fmt --all --check

      - name: Rust clippy
        working-directory: rust-api
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        working-directory: rust-api
        env:
          OPENFDD_FIELDBUS_CONFIG_DIR: ${{ github.workspace }}/config
        run: cargo test --workspace
