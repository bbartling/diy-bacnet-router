# Unit tests on Python 3.12 (no PyPI publish / no package build).

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project + Rust protocol wheels
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]" rusty-bacnet rusty-haystack

      - name: Run unit tests
        run: pytest tests/unit -v --tb=short
