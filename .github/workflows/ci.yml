name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.93.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check
      - run: npm run build

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/web/package-lock.json
      - name: Build frontend
        working-directory: frontend/web
        run: |
          npm ci
          npm run build
      - name: Build management daemon
        run: cargo build -p routerd --locked
      - name: Install Playwright Chromium
        working-directory: frontend/web
        run: npx playwright install --with-deps chromium
      - name: Start appliance and run Playwright
        working-directory: frontend/web
        env:
          BASE_URL: http://127.0.0.1:18080
        run: |
          set -euo pipefail
          cp ../../config/router.example.toml /tmp/dbr-e2e-router.toml
          ../../target/debug/diy-bacnet-router --check-config --config /tmp/dbr-e2e-router.toml
          DBR_BIND=127.0.0.1:18080 DBR_WEB_ROOT="$PWD/dist" \
            ../../target/debug/diy-bacnet-router --config /tmp/dbr-e2e-router.toml &
          echo $! > /tmp/dbr-e2e.pid
          for _ in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null; then
              break
            fi
            sleep 0.5
          done
          curl -fsS http://127.0.0.1:18080/healthz
          npm run test:e2e
          kill "$(cat /tmp/dbr-e2e.pid)" || true
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: playwright-e2e
          path: |
            frontend/web/playwright-report
            frontend/web/test-results
          if-no-files-found: ignore

  repository-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/validate-repository.sh
      - run: bash scripts/validate-workflows.sh

  security:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: 1.93.0
      - name: Install Rust security tools
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-deny --version 0.20.2 --locked
      - name: cargo audit
        run: |
          cargo metadata --locked --no-deps --format-version 1 >/dev/null
          cargo audit
      - name: cargo deny advisories
        run: cargo deny check advisories
