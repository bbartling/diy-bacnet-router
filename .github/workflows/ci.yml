# CI — Rust axum gateway (primary) + legacy Python unit tests.

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      # Sibling layout: rusty-bacnet/ rusty-haystack/ diy-bacnet-server/
      # (matches rust-api path deps: ../../rusty-bacnet)
      - uses: actions/checkout@v5
        with:
          path: diy-bacnet-server

      - name: Checkout rusty-bacnet
        uses: actions/checkout@v5
        with:
          repository: bbartling/rusty-bacnet
          path: rusty-bacnet

      - name: Checkout rusty-haystack
        uses: actions/checkout@v5
        with:
          repository: bbartling/rusty-haystack
          path: rusty-haystack

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96"
          components: rustfmt, clippy

      - name: Rust fmt
        working-directory: diy-bacnet-server/rust-api
        run: cargo fmt --all --check

      - name: Rust clippy
        working-directory: diy-bacnet-server/rust-api
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Rust tests
        working-directory: diy-bacnet-server/rust-api
        run: cargo test --workspace

  python-legacy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: diy-bacnet-server

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project + Rust protocol wheels
        working-directory: diy-bacnet-server
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" rusty-bacnet rusty-haystack

      - name: Run legacy Python unit tests
        working-directory: diy-bacnet-server
        run: pytest tests/unit -v --tb=short
