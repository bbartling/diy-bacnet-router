[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diy-bacnet-server"
version = "1.0.0"
description = "Rust-backed FastAPI + Swagger BACnet/Modbus/Haystack gateway (rusty-bacnet, rusty-modbus, rusty-haystack via PyO3)"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "httpx>=0.27",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
rust = [
  "rusty-bacnet>=0.1",
  "rusty-haystack>=0.1",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: live bench or docker sidecar required",
]
